name: Sample Audit (Matrix)

on:
  workflow_dispatch:
    inputs:
      start-batch:
        description: 'Start batch index'
        required: false
        default: '0'
      end-batch:
        description: 'End batch index (exclusive)'
        required: false
        default: '5'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/audit-matrix.yml'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          START=${{ github.event.inputs.start-batch || '0' }}
          END=${{ github.event.inputs.end-batch || '5' }}
          INDICES=""
          for i in $(seq $START $((END - 1))); do
            if [ -z "$INDICES" ]; then INDICES="$i"
            else INDICES="$INDICES,$i"
            fi
          done
          echo "matrix=[$INDICES]" >> $GITHUB_OUTPUT
          echo "Batches: [$INDICES]"

  audit:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        batch-index: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python3 -c "import librosa, soundfile, pyloudnorm; print('deps OK')"

      - name: Run audit batch ${{ matrix.batch-index }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 scripts/audit-runner.py --batch-index ${{ matrix.batch-index }} --results-dir results/

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ matrix.batch-index }}-results
          path: results/
          retention-days: 90

      - name: Push results to results repo
        env:
          RESULTS_PAT: ${{ secrets.RESULTS_PAT }}
        run: |
          cd results
          git init
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git checkout -b main
          git add .
          git commit -m "batch ${{ matrix.batch-index }} results"
          git push --force "https://${RESULTS_PAT}@github.com/admin-sonicloud/sample-audit-results.git" main

      - name: Print summary
        run: |
          cat results/batch-${{ matrix.batch-index }}-summary.json || echo "No summary file"
